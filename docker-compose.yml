services:
  db:
    image: postgres:15-alpine
    container_name: idi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idi_db
      POSTGRES_USER: idi_user
      POSTGRES_PASSWORD: idi_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount media directory with proper permissions
      - ./media:/app/media
      # Optional: Mount static files for development
      - ./staticfiles:/app/staticfiles
    # Inject secrets (SECRET_KEY, DB credentials, GA_MEASUREMENT_ID, ...) from the host
    # .env at runtime — keeps them out of the built image.
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
      # Media settings
      - MEDIA_ROOT=/app/media
      - MEDIA_URL=/media/
    depends_on:
      - db
    # Ensure proper user mapping for volume permissions
    # user: "1000:1000"  # Commented out for server deployment - let entrypoint handle permissions
    restart: unless-stopped
    
  # Optional: Add nginx for better static/media file serving
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/usr/share/nginx/html/media:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata: