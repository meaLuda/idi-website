services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount media directory with proper permissions
      - ./media:/app/media
      # Optional: Mount static files for development
      - ./staticfiles:/app/staticfiles
    # Inject secrets (SECRET_KEY, DB credentials, GA_MEASUREMENT_ID, ...) from the host
    # .env at runtime — keeps them out of the built image.
    env_file:
      - .env
    environment:
      - DEBUG=False
      # The shared dev-postgres container already running on this machine, rather
      # than a second Postgres bundled into this compose file. DB_NAME/DB_USER/
      # DB_PASSWORD come from .env and point at a database dedicated to this
      # branch, so the other branch's ididb is left alone.
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      # 127.0.0.1 inside a container is the container, not the host, so the
      # default cache URL cannot reach the shared dev-valkey. The throttle fails
      # open, so a wrong value degrades quietly rather than breaking pages --
      # which is exactly why it is worth setting explicitly.
      - CACHE_URL=redis://host.docker.internal:6379/3
      # Local runs have no TLS in front of the container. Without this, every
      # request 301s to https://127.0.0.1:8000, which gunicorn cannot serve, so
      # the browser hangs. Remove (or set True) wherever a TLS terminator such as
      # Traefik sits in front.
      - SECURE_SSL_REDIRECT=False
      # Media settings
      - MEDIA_ROOT=/app/media
      - MEDIA_URL=/media/
    extra_hosts:
      # Docker Desktop provides this automatically; declaring it keeps the
      # compose file working on Linux engines too.
      - "host.docker.internal:host-gateway"
    # Ensure proper user mapping for volume permissions
    # user: "1000:1000"  # Commented out for server deployment - let entrypoint handle permissions
    restart: unless-stopped
    
  # Optional: Add nginx for better static/media file serving
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/usr/share/nginx/html/media:ro
      - ./staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - production

