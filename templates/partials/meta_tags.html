{% load static %}
<!-- Primary Meta Tags -->
<meta name="title" content="{% if page_title %}{{ page_title }} | IDI Africa{% else %}IDI Africa - Decision Intelligence Design{% endif %}">
<meta name="description" content="{% if page_description %}{{ page_description }}{% else %}Decision Intelligence Design in Africa - Transforming complexity into actionable solutions.{% endif %}">
<meta name="keywords" content="{% if page_keywords %}{{ page_keywords }}{% else %}Decision Intelligence, Design, AI, Fellowship, Innovation, Africa, Kenya{% endif %}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="author" content="Institute of Design & Innovation">
<meta name="theme-color" content="#006377">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% if og_type %}{{ og_type }}{% else %}website{% endif %}">
<meta property="og:site_name" content="IDI Africa">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:title" content="{% if page_title %}{{ page_title }} | IDI Africa{% else %}IDI Africa - Decision Intelligence Design{% endif %}">
<meta property="og:description" content="{% if page_description %}{{ page_description }}{% else %}Decision Intelligence Design in Africa - Transforming complexity into actionable solutions.{% endif %}">
<meta property="og:image" content="{% if page_image %}{{ request.scheme }}://{{ request.get_host }}{{ page_image.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/og/idi-og.jpg' %}{% endif %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page_title %}{{ page_title }} | IDI Africa{% else %}IDI Africa - Decision Intelligence Design{% endif %}">
<meta name="twitter:description" content="{% if page_description %}{{ page_description }}{% else %}Decision Intelligence Design in Africa - Transforming complexity into actionable solutions.{% endif %}">
<meta name="twitter:image" content="{% if page_image %}{{ request.scheme }}://{{ request.get_host }}{{ page_image.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/og/idi-og.jpg' %}{% endif %}">

<!-- Canonical link -->
<link rel="canonical" href="{{ request.build_absolute_uri }}">
