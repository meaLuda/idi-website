{% extends 'base.html' %}

{% block content %}
<div class="navbar-spacing bg-surface-alt min-h-screen py-10 sm:py-16">
  <div class="container mx-auto max-w-2xl px-4 sm:px-6">
    <div class="bg-white rounded-2xl shadow-card px-6 py-8 sm:px-10 sm:py-10">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-ink">Too many attempts</h1>
      <p class="mt-3 text-ink-muted">
        Too many verification attempts have come from your connection recently.
        Please wait a few minutes and try again.
      </p>
      <p class="mt-6 text-sm text-ink-muted">
        If you are verifying several certificates for an organisation,
        <a href="{% url 'home:contact' %}" class="text-brand-teal-500 font-semibold underline hover:no-underline">get in touch</a>
        and we will help.
      </p>
    </div>
  </div>
</div>
{% endblock %}
