<!-- templates/home/team_member_detail.html -->
{% extends 'base.html' %}
{% load static %}

{% block content %}
{% if single_member %}
    <section class="py-20 min-h-screen bg-gray-50">
        <div class="container mx-auto px-4 max-w-5xl">
            <!-- Back Button -->
            <div class="mb-8">
                <a href="{% url 'home:team_list' %}" class="inline-flex items-center px-5 py-2.5 bg-white text-[#006377] font-semibold rounded-full shadow hover:shadow-md hover:bg-gray-50 transition-all duration-300 border border-gray-200">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Our Team
                </a>
            </div>

            <!-- Main Content Card -->
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                <div class="grid grid-cols-1 md:grid-cols-12">
                    
                    <!-- Left Column - Image & Quick Info -->
                    <div class="md:col-span-5 bg-gradient-to-b from-[#f3f3f3] to-[#e9f5f7] p-8 md:p-12 flex flex-col items-center justify-center text-center">
                        <div class="relative w-64 h-64 md:w-72 md:h-72 mb-8">
                            <div class="absolute inset-0 bg-[#006377] rounded-full opacity-10 blur-xl transform scale-105"></div>
                            <img src="{% if member.image %}{{ member.image.url }}{% else %}https://cdn.pixabay.com/photo/2022/10/07/10/56/the-universe-7504793_960_720.jpg{% endif %}" 
                                 alt="{{ member.name }}" 
                                 class="relative w-full h-full object-cover rounded-full shadow-lg border-4 border-white grayscale hover:grayscale-0 transition-all duration-500" loading="lazy">
                        </div>
                        
                        <h1 class="text-3xl md:text-4xl font-bold text-[#006377] mb-3">{{ member.name }}</h1>
                        <p class="text-xl font-medium text-gray-600 mb-8">{{ member.position }}</p>

                        {% if member.linkedin %}
                        <a href="{{ member.linkedin }}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center justify-center w-14 h-14 bg-white rounded-full shadow-md hover:shadow-lg transition-transform hover:-translate-y-1">
                            <img src="{% static 'images/linkedin-icon.svg' %}" alt="LinkedIn" class="w-7 h-7" loading="lazy">
                        </a>
                        {% endif %}
                    </div>

                    <!-- Right Column - Bio -->
                    <div class="md:col-span-7 p-8 md:p-12 lg:p-16 flex flex-col justify-center bg-white">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4 inline-block">Biography</h2>
                        
                        <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed font-medium">
                            {{ member.bio|safe }}
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>
{% endif %}
{% endblock %}
