{# Stats strip: backend-driven metrics, divided by vertical rules on desktop. #}
{% if home_stats %}
<section class="bg-white py-12 lg:py-16">
    <div class="container mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-y-10 lg:divide-x lg:divide-gray-200">
            {% for stat in home_stats %}
            <div class="flex flex-col justify-center text-center lg:px-6 lg:min-h-[150px]">
                <div class="text-5xl lg:text-6xl font-extrabold text-ink leading-none">{{ stat.value }}</div>
                <p class="mt-3 text-eyebrow uppercase text-brand-teal-500 font-medium tracking-wide">{{ stat.label }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
