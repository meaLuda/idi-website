{% load static %}
{# Stats strip: backend-driven metrics, divided by vertical rules on desktop. #}
{% if home_stats %}
<section class="w-full bg-white relative border-b border-gray-100">
    <!-- IDI brand mosaic band - repeats horizontally at the top of the section -->
    <div class="h-6 md:h-8 w-full bg-repeat-x bg-left"
         style="background-image: url('/static/images/home/divider-mosaic.png'); background-size: auto 100%;"
         role="presentation" aria-hidden="true"></div>

    <div class="max-w-7xl mx-auto px-2 py-8 md:py-16">
        <!-- Bulletproof flex-row layout to ensure all 4 columns stay in a horizontal line -->
        <div class="flex flex-row items-stretch justify-between divide-x divide-gray-200 w-full">
            {% for stat in home_stats %}
            <div class="flex-1 flex flex-col items-center justify-center text-center px-1 sm:px-3 md:px-6">
                <!-- Responsively scaled large bold metric number -->
                <div class="text-2xl sm:text-3xl md:text-5xl lg:text-6xl font-black text-black tracking-tight leading-none mb-2 md:mb-3">
                    {{ stat.value }}
                </div>
                <!-- Responsively scaled elegant brand teal uppercase label -->
                <p class="text-[7px] sm:text-[9px] md:text-xs font-bold tracking-[0.15em] text-[#006377] uppercase leading-relaxed px-0.5">
                    {{ stat.label }}
                </p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
